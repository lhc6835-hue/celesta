<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="CELESTA — 하늘섬 왕국이 잠든 열 개의 지층을 파 내려가며 26종의 보물 상자를 여는 2D 픽셀 아트 발굴 게임">
<title>셀레스타 발굴기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Gowun+Dodum&family=Black+Han+Sans&family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* 레이아웃: 전체 화면 캔버스 위에 황동·가죽 질감의 HUD와 모달을 띄운다. 단일 다크 룩. */
:root{
  color-scheme: dark;
  --ink:#130f0c; --leather:#2b201a; --leather2:#3a2b22; --brass:#d2a94e; --brass-d:#8a6a2a;
  --parch:#f0e3c2; --muted:#b9a88a; --teal:#5cc3b4; --danger:#e0604a;
  --r-common:#c9c4b8; --r-uncommon:#6fd36a; --r-rare:#4fa6ff; --r-epic:#b56cff; --r-legend:#ffad33; --r-myth:#ff5f8f;
  --f-display:"Song Myung","Nanum Myeongjo",serif; --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-impact:"Black Han Sans","Gowun Dodum",sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--parch);font-family:var(--f-body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;z-index:10}
#fx.on{pointer-events:auto}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:flex-start;justify-content:space-between;pointer-events:none;z-index:5}
.plate{background:linear-gradient(#3a2b22,#251b16);border:2px solid var(--brass-d);box-shadow:inset 0 0 0 1px #00000080,0 4px 14px #0008;border-radius:10px;padding:8px 12px}
.hud .left{display:flex;flex-direction:column;gap:6px;min-width:0}
.layer-name{font-family:var(--f-display);font-size:18px;color:var(--brass);letter-spacing:.04em;text-shadow:0 2px 0 #000}
.depth{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.oil{width:180px;max-width:42vw;height:10px;background:#0006;border:1px solid var(--brass-d);border-radius:6px;overflow:hidden}
.oil>i{display:block;height:100%;background:linear-gradient(90deg,#ff9b3d,#ffd36b);transition:width .2s}
.oil.low>i{background:linear-gradient(90deg,#c0392b,#ff7a50);animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.4}}
.gold{font-family:var(--f-impact);font-size:20px;color:#ffd66b;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.gold small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.btns{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;z-index:6;flex-wrap:wrap;justify-content:flex-end;max-width:60vw}
button{font-family:var(--f-body);font-size:14px;color:var(--parch);background:linear-gradient(#4a372b,#2d2119);border:2px solid var(--brass-d);border-radius:9px;padding:9px 13px;cursor:pointer;box-shadow:0 3px 0 #0009;transition:transform .08s,filter .15s}
button:hover{filter:brightness(1.18)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #0009}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.primary{background:linear-gradient(#e7c063,#a37b2c);color:#2a1a08;border-color:#ffe39a;font-weight:700}
button[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pad{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px;z-index:6}
.pad button{padding:0;font-size:22px;border-radius:14px;background:#2d2119cc}
.touch .pad{display:grid}
.modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0806cc;backdrop-filter:blur(3px);z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.sheet{width:min(760px,100%);max-height:100%;overflow:auto;background:radial-gradient(120% 90% at 50% 0%,#3f2f24,#211812);border:3px solid var(--brass-d);border-radius:16px;box-shadow:0 0 0 1px #000,0 20px 60px #000c;padding:20px}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0 0 4px;color:var(--brass);text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.6;max-width:65ch}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button.on{background:linear-gradient(#e7c063,#a37b2c);color:#2a1a08}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:#0004;border:1px solid #ffffff14;border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card canvas{position:static;width:100%;height:auto;aspect-ratio:1/1;max-width:100%;background:radial-gradient(#ffffff10,#0000 70%);border-radius:8px}
.card b{font-family:var(--f-display);font-weight:400;font-size:16px}
.card p{margin:0;font-size:12px;color:var(--muted);line-height:1.5}
.card.locked b{color:#776a58}
.tag{font-size:11px;letter-spacing:.08em;padding:2px 7px;border-radius:99px;align-self:flex-start;border:1px solid currentColor}
.up{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0004;border:1px solid #ffffff14;border-radius:12px;padding:12px;flex-wrap:wrap}
.up+.up{margin-top:8px}
.up div{min-width:0;flex:1 1 220px}
.up b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--parch)}
.up p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.5}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:middle}
.pips i{width:9px;height:9px;border-radius:2px;background:#0006;border:1px solid var(--brass-d)}
.pips i.f{background:var(--brass)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bag{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
.bag span{font-size:12px;padding:3px 8px;border-radius:7px;background:#0005;border:1px solid currentColor}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:8;pointer-events:none;width:min(520px,90vw)}
#toast div{background:#1d1510ee;border:1px solid var(--brass-d);padding:8px 14px;border-radius:10px;font-size:14px;animation:tin .25s ease-out;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* 타이틀: 금박 장식 세리프 로고 + 픽셀 서브타이틀, 뒤로는 실제 노을 풍경이 비친다 */
:root{--f-logo:"Cinzel Decorative","Cinzel",serif;--f-cap:"Cinzel",serif;--f-it:"Cormorant Garamond",serif;--f-px:"Silkscreen","Gowun Dodum",monospace}
#title{position:fixed;inset:0;z-index:40;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;background:radial-gradient(ellipse 70% 60% at 50% 42%,#0b071000 0%,#0b071040 55%,#0b0710c8 100%),linear-gradient(#0b071000 55%,#0b0710e0)}
#tfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.t-rays{position:absolute;left:50%;top:40%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#ffd9a000 0deg 9deg,#ffd9a022 11deg 13deg,#ffd9a000 15deg 24deg);-webkit-mask:radial-gradient(circle,#000 0,#0000 46%);mask:radial-gradient(circle,#000 0,#0000 46%);animation:tspin 90s linear infinite;pointer-events:none}
.t-rune{position:absolute;left:50%;top:40%;width:min(760px,118vw);aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;opacity:.16;animation:tspin 240s linear infinite reverse}
.t-rune svg{width:100%;height:100%;overflow:visible}
@keyframes tspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.t-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;max-width:100%}
.t-eyebrow{display:flex;align-items:center;gap:14px;font-family:var(--f-px);font-size:11px;letter-spacing:.32em;color:#9fe6d8;text-shadow:0 1px 0 #000;opacity:0;animation:tfade .8s .2s ease-out forwards}
.t-eyebrow i{width:46px;height:1px;background:linear-gradient(90deg,#0000,#9fe6d8,#0000);position:relative}
.t-eyebrow i::after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;background:#ffd36b;transform:translate(-50%,-50%) rotate(45deg)}
.t-logo{margin:0;display:flex;flex-direction:column;align-items:center;line-height:1}
.t-top{font-family:var(--f-it);font-style:italic;font-weight:600;font-size:clamp(18px,2.6vw,30px);letter-spacing:.55em;margin-right:-.55em;color:#ffe9c4;text-shadow:0 2px 0 #3a1a28,0 0 18px #ffb08088;opacity:0;animation:tfade 1s .25s ease-out forwards}
.t-word{display:flex;font-family:var(--f-logo);font-weight:900;font-size:clamp(54px,13.5vw,176px);letter-spacing:.04em;margin:.04em 0 .02em;filter:drop-shadow(0 2px 0 #7a4210) drop-shadow(0 3px 0 #4a2208) drop-shadow(0 4px 0 #2a1004) drop-shadow(0 14px 22px #000a) drop-shadow(0 0 34px #ffb84a55)}
.t-word span{display:inline-block;background:linear-gradient(100deg,#fff8dc 0%,#ffd36b 22%,#c0802c 40%,#fff4c4 50%,#c0802c 60%,#ffd36b 78%,#fff8dc 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;opacity:0;transform:translateY(-.6em) scale(1.25);filter:blur(10px);animation:tdrop 1.1s cubic-bezier(.2,1.3,.4,1) forwards,tsheen 9s linear infinite;animation-delay:calc(.45s + var(--i)*.08s),calc(1.8s + var(--i)*.1s)}
@keyframes tdrop{to{opacity:1;transform:none;filter:none}}
@keyframes tsheen{from{background-position:100% 0}to{background-position:-200% 0}}
@keyframes tfloat{0%,100%{translate:0 0}50%{translate:0 -.045em}}
@keyframes tfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.t-sub{display:flex;align-items:center;gap:12px;font-family:var(--f-px);font-weight:700;font-size:clamp(11px,1.5vw,16px);letter-spacing:.42em;margin-right:-.42em;color:#ffd9a0;text-shadow:0 2px 0 #2a1004;opacity:0;animation:tfade .9s 1.25s ease-out forwards}
.t-sub::before,.t-sub::after{content:"";width:clamp(20px,6vw,70px);height:2px;background:repeating-linear-gradient(90deg,#ffd36b 0 4px,#0000 4px 7px)}
.t-ko{margin:2px 0 0;font-family:var(--f-display);font-size:clamp(14px,1.8vw,18px);color:#f0e3c2;text-shadow:0 2px 6px #000;letter-spacing:.06em;opacity:0;animation:tfade 1s 1.5s ease-out forwards}
.t-stage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,4vw,46px);margin-top:4px;opacity:0;animation:tfade 1s 1.7s ease-out forwards}
.t-stage canvas{position:static;width:min(180px,40vw);height:auto;image-rendering:pixelated;animation:tbob 4s ease-in-out infinite;filter:drop-shadow(0 0 22px #ff8fb066)}
@keyframes tbob{50%{transform:translateY(-5px)}}
#hero{animation:herobob 1.2s steps(2) infinite}
@keyframes herobob{50%{transform:translateY(-4px)}}
.t-menu{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;opacity:0;animation:tfade .9s 1.9s ease-out forwards}
.t-btn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:min(240px,80vw);padding:13px 26px 11px;font-family:var(--f-px);font-weight:700;font-size:15px;letter-spacing:.22em;color:#f6ecd4;background:linear-gradient(#3a2b22e8,#1e1510e8);border:2px solid #8a6a2a;border-radius:4px;box-shadow:0 0 0 2px #0008,inset 0 0 0 1px #ffe39a22,0 10px 26px #000a;backdrop-filter:blur(4px)}
.t-btn small{font-family:var(--f-body);font-weight:400;font-size:11px;letter-spacing:.12em;color:#c9b68e}
.t-btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,#fff0,#fff6,#fff0);transform:skewX(-20deg);transition:left .6s}
.t-btn:hover::after{left:130%}
.t-btn:hover{filter:brightness(1.15);transform:translateY(-2px)}
.t-btn.t-main{color:#2a1606;background:linear-gradient(#ffe7a0,#e0a83e 55%,#a86e22);border-color:#fff0b8;text-shadow:0 1px 0 #fff6}
.t-btn.t-main small{color:#5a3410}
.t-user{min-height:18px;font-family:var(--f-px);font-size:11px;letter-spacing:.18em;color:#9fe6d8;opacity:0;animation:tfade .8s 2.1s ease-out forwards}
#title .keys{font-size:12px;color:#c8b8a0;text-shadow:0 1px 3px #000;opacity:0;animation:tfade .8s 2.2s ease-out forwards}
.t-foot{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);font-family:var(--f-px);font-size:10px;letter-spacing:.3em;color:#ffffff55;}
@keyframes tblink{50%{opacity:.35}}
@media (max-width:640px){.t-eyebrow{font-size:9px;letter-spacing:.2em}.t-eyebrow i{width:20px}}
@media (max-height:620px){.t-stage{display:none}}
@media (prefers-reduced-motion:reduce){.t-word span{opacity:1;transform:none;filter:none}}
kbd{font-family:var(--f-body);background:#0006;border:1px solid var(--brass-d);border-bottom-width:3px;border-radius:5px;padding:1px 6px;font-size:12px;color:var(--parch)}
#acctM{z-index:60}
#tutM{z-index:55}
#depthBar{position:fixed;left:auto;right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 74px);bottom:auto;width:64px;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 150px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 150px);z-index:5;pointer-events:none;image-rendering:pixelated}
#compassDial{position:fixed;inset:auto;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 108px);width:96px;height:122px;z-index:5;pointer-events:none}
#trans{z-index:65;pointer-events:none}
#stratum{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16%);transform:translateX(-50%);z-index:9;pointer-events:none;text-align:center;display:flex;flex-direction:column;gap:4px;padding:14px 34px;width:max-content;max-width:90vw;background:linear-gradient(90deg,#0000,#0b0710d8 20%,#0b0710d8 80%,#0000)}
#stratum small{font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.35em;color:var(--c)}
#stratum b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,42px);color:#f6ecd4;letter-spacing:.08em;text-shadow:0 3px 0 #000,0 0 24px var(--c)}
#stratum i{font-style:normal;font-size:12px;color:#c8b8a0}
#stratum::before,#stratum::after{content:"";position:absolute;left:10%;right:10%;height:1px;background:linear-gradient(90deg,#0000,var(--c),#0000)}
#stratum::before{top:0}#stratum::after{bottom:0}
#stratum.go{animation:strIn 3.2s ease forwards}
@keyframes strIn{0%{opacity:0;letter-spacing:.3em;filter:blur(6px)}12%{opacity:1;filter:none}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.sheet.tut{width:min(860px,100%)}
.tut-head{display:flex;justify-content:space-between;align-items:center;font-family:"Silkscreen",monospace;font-size:11px;letter-spacing:.2em;color:var(--teal);margin-bottom:10px}
.tut-head button{font-size:12px;padding:6px 10px}
.tut-body{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.tut-art{flex:0 1 auto;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-width:0;max-width:100%}
.tut-art canvas{position:static;width:auto;height:auto;max-width:100%;image-rendering:pixelated;border-radius:8px}
.tut-text{flex:1 1 280px;min-width:0}
.tut-text h2{margin:0 0 8px}
.tut-text p{margin:0;line-height:1.8;color:#e8dcc0;font-size:14px;max-width:62ch}
.tut-nav button{white-space:nowrap}
.tut-nav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px}
.tut-dots{display:flex;gap:6px}.tut-dots i{width:8px;height:8px;background:#0006;border:1px solid var(--brass-d);transform:rotate(45deg)}.tut-dots i.on{background:var(--brass)}
.rar-ladder{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr));gap:6px}
.rar-ladder span{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border:1px solid var(--c);border-radius:6px;background:#0005;color:var(--c);font-size:13px}
.rar-ladder small{font-family:"Silkscreen",monospace;font-size:9px;opacity:.8;align-self:center}
.rar-ladder span.prism{background:linear-gradient(90deg,#ff5a5a33,#ffd36b33,#5aff9a33,#5ac8ff33,#c85aff33)}
.rar-ladder span.heart{grid-column:1/-1;background:linear-gradient(90deg,#ff8fc833,#ffd36b33);font-weight:700}
@media (max-width:640px){.btns .bl{display:none}.btns{max-width:none;gap:6px}.btns button{padding:9px 11px}#depthBar{width:48px;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 240px)}#compassDial{width:78px;height:99px;top:calc(env(safe-area-inset-top,0px) + 100px)}}
.acct-form{display:grid;gap:6px;margin-top:6px}
.acct-form label{font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:6px}
.acct-form input,.acct-srv input{font:15px var(--f-body);color:var(--parch);background:#0007;border:2px solid var(--brass-d);border-radius:8px;padding:10px 12px;min-width:0;width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
.acct-form input:focus,.acct-srv input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px #5cc3b433}
.acct-form button[type=submit]{margin-top:12px;padding:12px}
.acct-msg{min-height:20px;margin:10px 0 0;font-size:13px;color:var(--teal);line-height:1.5}
.acct-msg.bad{color:#ff8a70}
.acct-srv{margin-top:14px;border-top:1px solid #ffffff14;padding-top:10px}
.acct-srv summary{cursor:pointer;font-size:13px;color:var(--muted)}
.acct-srv .row{flex-wrap:nowrap}.acct-srv .row input{flex:1}
@media (max-width:480px){.acct-srv .row{flex-wrap:wrap}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){.layer-name{font-size:15px}.gold{font-size:17px}.btns button{padding:8px 10px;font-size:13px}}
</style>

</head>
<body>
<canvas id="game"></canvas>
<canvas id="fx"></canvas>

<canvas id="depthBar" hidden aria-label="지층 위치 바"></canvas>
<canvas id="compassDial" hidden aria-label="보물 나침반"></canvas>
<div id="stratum" hidden></div>
<canvas id="trans" hidden></canvas>
<div class="hud" id="hud" hidden>
  <div class="left plate">
    <div class="layer-name" id="layerName">들풀 표토</div>
    <div class="depth" id="depth">깊이 0m</div>
    <div class="oil" id="oil"><i id="oilBar" style="width:100%"></i></div>
  </div>
  <div class="plate gold" id="gold">0 <small>셀라</small></div>
</div>
<div class="btns" id="btns" hidden>
  <button id="bCamp" type="button" aria-label="야영지">⛺<span class="bl"> 야영지</span></button>
  <button id="bReturn" type="button" aria-label="귀환">↑<span class="bl"> 귀환 (R)</span></button>
  <button id="bCodex" type="button" aria-label="도감">📖<span class="bl"> 도감 (C)</span></button>

  };
  requestAnimationFrame(loop);
}
if (!load()) { genWorld(Math.floor(Math.random() * 1e9)); spawn(); G.oil = maxOil(); }
buildTitle(); buildTitleLabels(); refreshAcctUI();
camUpdate(0, true);
requestAnimationFrame(frame);
window.__celesta = { G, player, world: () => world, startOpening, previewOpening, CHESTS, get opening() { return opening; } };
</script>
